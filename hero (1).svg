<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Terminal: whoami — Jayanta, Laravel security engineer">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14">
        <animate attributeName="stop-color" values="#0B0E14;#0E1630;#1A0F2E;#0B0E14" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10141F">
        <animate attributeName="stop-color" values="#10141F;#1D1038;#0D1E2B;#10141F" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#22D3EE"/>
      <stop offset="0.33" stop-color="#8B5CF6"/>
      <stop offset="0.66" stop-color="#F472B6"/>
      <stop offset="1"    stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 520 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Typing reveals -->
    <clipPath id="c1"><rect x="68" y="100" height="26" width="0">
      <animate attributeName="width" values="0;0;110;110;110;110;110;0" keyTimes="0;0.03;0.13;0.30;0.55;0.90;0.96;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="68" y="132" height="30" width="0">
      <animate attributeName="width" values="0;0;0;430;430;430;430;0" keyTimes="0;0.03;0.16;0.30;0.55;0.90;0.96;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="68" y="176" height="26" width="0">
      <animate attributeName="width" values="0;0;0;0;180;180;180;0" keyTimes="0;0.03;0.16;0.36;0.50;0.90;0.96;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="68" y="208" height="30" width="0">
      <animate attributeName="width" values="0;0;0;0;0;560;560;0" keyTimes="0;0.03;0.16;0.36;0.56;0.70;0.96;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>

    <style>
      .m { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1000" height="300" rx="14" fill="url(#bg)"/>

  <!-- Drifting colour orbs -->
  <circle cx="150" cy="70" r="130" fill="#22D3EE" opacity="0.10">
    <animate attributeName="cx" values="150;300;150" dur="17s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="17s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="230" r="150" fill="#F472B6" opacity="0.10">
    <animate attributeName="cx" values="870;700;870" dur="21s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.20;0.08" dur="21s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="20" r="120" fill="#8B5CF6" opacity="0.10">
    <animate attributeName="cy" values="20;90;20" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Terminal window -->
  <rect x="40" y="40" width="920" height="220" rx="12" fill="#070A11" opacity="0.80" stroke="#8B5CF6" stroke-opacity="0.30"/>
  <line x1="40" y1="76" x2="960" y2="76" stroke="#8B5CF6" stroke-opacity="0.20"/>
  <circle cx="66" cy="58" r="5.5" fill="#F43F5E"/>
  <circle cx="86" cy="58" r="5.5" fill="#FBBF24"/>
  <circle cx="106" cy="58" r="5.5" fill="#34D399"/>
  <text class="m" x="500" y="62" font-size="12" fill="#475569" text-anchor="middle" letter-spacing="1.4">jayanta@github ~ zsh</text>

  <!-- Line 1: command -->
  <g clip-path="url(#c1)" class="m" font-size="17">
    <text x="68" y="119" fill="#34D399">$</text>
    <text x="90" y="119" fill="#E2E8F0">whoami</text>
  </g>

  <!-- Line 2: output -->
  <g clip-path="url(#c2)">
    <text class="m" x="68" y="156" font-size="25" font-weight="700" fill="url(#spectrum)" filter="url(#glow)">Jayanta</text>
    <text class="m" x="180" y="156" font-size="16" fill="#94A3B8">— Laravel security engineer, India</text>
  </g>

  <!-- Line 3: command -->
  <g clip-path="url(#c3)" class="m" font-size="17">
    <text x="68" y="195" fill="#34D399">$</text>
    <text x="90" y="195" fill="#E2E8F0">cat focus.txt</text>
  </g>

  <!-- Line 4: output chips -->
  <g clip-path="url(#c4)" class="m" font-size="16">
    <text x="68"  y="230" fill="#F43F5E">threat detection</text>
    <text x="228" y="230" fill="#475569">·</text>
    <text x="248" y="230" fill="#8B5CF6">api versioning</text>
    <text x="388" y="230" fill="#475569">·</text>
    <text x="408" y="230" fill="#22D3EE">open source</text>
    <text x="528" y="230" fill="#475569">·</text>
    <text x="548" y="230" fill="#FBBF24">performance</text>
  </g>

  <!-- Blinking cursor after the last line -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.03;0.16;0.36;0.68;0.72;0.94;1" dur="13s" repeatCount="indefinite"/>
    <rect x="678" y="216" width="10" height="19" fill="#22D3EE">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Spectrum progress rule -->
  <rect x="40" y="277" width="0" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" values="0;920;920;0" keyTimes="0;0.72;0.94;1" dur="13s" repeatCount="indefinite"/>
  </rect>

</svg>
